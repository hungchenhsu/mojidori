name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # dtolnay/rust-toolchain determines which toolchain to install from
      # the ref name in `uses:` (stable/nightly/master), not from the
      # code at that ref — pinning to a SHA loses that signal, so
      # `toolchain: stable` below restores it explicitly.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  # Note: a startup-bench job (release build + scripts/startup-bench.mjs
  # with a hard threshold) was attempted here and removed on 2026-07-10.
  # On GitHub's macOS runners the app's WKWebView never begins loading
  # the page — native setup completes in ~1.7s, then silence; the
  # on_page_load Started event never fires — so the startup probe cannot
  # complete. An Aqua session is present and ad-hoc codesigning did not
  # help; root cause undetermined. Run the benchmark locally instead
  # (see scripts/startup-bench.mjs).
