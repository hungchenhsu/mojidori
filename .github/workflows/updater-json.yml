name: Publish updater feed

# tauri-plugin-updater's endpoint can't point at
# .../releases/latest/download/latest.json: release.yml's release is
# `prerelease: true` (all v0.x are alphas), and GitHub's "latest" release
# semantics explicitly skip prereleases — so that endpoint would 404
# forever (ROADMAP.md D2 critic finding). Instead there's one fixed
# "updater" release (tag `updater`, never itself an alpha/draft) whose
# latest.json is republished here every time the maintainer manually
# publishes a real release — this only fires on that user-gated action,
# never on release.yml's own draft creation, keeping "release is
# user-gated" intact.
#
# Ordering (issue #343): each published event starts its own run, and a
# run's completion order says nothing about release order. So a run never
# just forwards "the release that triggered me": the concurrency group
# serializes runs, each run syncs the feed to the newest published release
# (by tag semver) that carries a latest.json, and scripts/updater-feed.mjs
# refuses to replace the current feed with anything not strictly newer.
# A queued run that the concurrency group cancels loses nothing — the run
# that survives computes the same result.
#
# The guard also means a deliberate rollback (unpublishing a bad release)
# never moves the feed back on its own; the maintainer must replace
# updater/latest.json by hand.
#
# If no published release has a latest.json, or the newest one is already
# what the feed serves (e.g. the triggering release is a manually created
# one outside release.yml's pipeline), this ends successfully without
# publishing anything — that's not an error, just nothing to do.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: updater-feed
  cancel-in-progress: false

jobs:
  publish-updater-json:
    # Guards against the "updater" rolling release's own publish event
    # (created below, `--latest=false` but still a real, non-draft
    # release, so it fires `published` too) re-triggering this workflow.
    if: github.event.release.tag_name != 'updater'
    runs-on: ubuntu-latest
    # Scoped to this job, not the workflow: this is the only job here,
    # and it needs write access to download from and upload to releases.
    permissions:
      contents: write
    steps:
      # The default branch, not the triggering tag: older tags predate
      # scripts/updater-feed.mjs, and the guard must be the current one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Find the newest published release with a latest.json
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --exclude-drafts --limit 1000 \
            --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          # Written to a file first: a failure inside `for ... in $(...)`
          # would not trip `bash -e`, silently yielding zero candidates.
          node scripts/updater-feed.mjs order-tags "$RUNNER_TEMP/releases.json" \
            > "$RUNNER_TEMP/tags.txt"
          mkdir -p "$RUNNER_TEMP/candidate"
          # Presence is checked explicitly so that only a genuinely absent
          # latest.json falls through to an older release; a failed lookup
          # or download of an existing one fails the run instead.
          while read -r tag; do
            # </dev/null: nothing in the loop body may consume tags.txt.
            assets=$(gh release view "$tag" --json assets \
              --jq '.assets[].name' < /dev/null)
            if grep -qx latest.json <<< "$assets"; then
              gh release download "$tag" --pattern latest.json \
                --dir "$RUNNER_TEMP/candidate" --clobber < /dev/null
              echo "Candidate: $tag"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < "$RUNNER_TEMP/tags.txt"
          echo "No published release has a latest.json; nothing to publish."

      - name: Ensure the rolling "updater" release exists
        if: steps.candidate.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view updater >/dev/null 2>&1 || gh release create updater \
            --title "Updater feed" \
            --notes "Rolling latest.json for the in-app updater. Do not delete." \
            --latest=false

      - name: Refuse to move the feed backwards
        id: guard
        if: steps.candidate.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/current"
          # No asset just means there's no feed yet (the guard treats an
          # absent file as "publish"); an existing one must download.
          assets=$(gh release view updater --json assets --jq '.assets[].name')
          if grep -qx latest.json <<< "$assets"; then
            gh release download updater --pattern latest.json \
              --dir "$RUNNER_TEMP/current" --clobber
          fi
          set +e
          node scripts/updater-feed.mjs should-publish \
            "$RUNNER_TEMP/current/latest.json" "$RUNNER_TEMP/candidate/latest.json"
          status=$?
          set -e
          case "$status" in
            0) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            10) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Publish latest.json to the rolling "updater" release
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload updater "$RUNNER_TEMP/candidate/latest.json" --clobber
